repos:
  - repo: local
    hooks:
      - id: black
        name: Black Formatter
        entry: black --check
        language: system
        types: [python]

      - id: ruff
        name: Ruff Linter
        entry: ruff check --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: pytest
        name: Run tests with pytest
        entry: pytest -v tests/ --tb=short --disable-warnings
        language: system
        types: [python]
        pass_filenames: false