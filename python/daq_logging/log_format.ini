[padding]
# Log record padding widths (in characters)
# These widths are used to align the log record fields in the output
# Adjust these values based on your logging format and preferences
time = 25
level = 10
file_and_line = 40
logger_name = 40

[logging]
# Logging format configuration
# The format string uses Python's logging module syntax
# Available fields: asctime, levelname, filename, name, message
# The 'asctime' field is formatted using the date_time setting below
# The 'levelname' field indicates the severity of the log message
# The 'filename' field shows the name of the file where the log was generated
# The 'name' field is the name of the logger that generated the log message
# The 'message' field is the actual log message content
# The date_time format uses strftime syntax
# Available time zones: UTC, local, or any valid timezone string
# Example: 'UTC' for Coordinated Universal Time, 'local' for local system time
# Note - double percent signs (%%) are used to escape percent signs in the format string
# TODO: for production, remove the filename
record_format=%%(asctime)s %%(levelname)s %%(filename)s %%(name)s %%(message)s
date_time=[%%Y/%%m/%%d %%H:%%M:%%S %%Z]
timezone=UTC

[theme]
# Define the color theme for logging output
# Colors can be set to 'dim', 'bold', or 'bright' variants of the colors
# Available colors: black, red, green, yellow, blue, magenta, cyan
# Background colors can be set with 'on_' prefix

# === Context elements ===
logging.time = dim blue
logging.location = dim white
logging.logger_name = dim white

# === Log level colors ===
logging.level.debug = dim cyan
logging.level.info = bold green
logging.level.warning = bold yellow
logging.level.error = bold red
logging.level.critical = bold white on red

[cli]
# Command-line interface options
help_option_names = -h,--help