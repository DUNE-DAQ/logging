[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daq_logging"
dynamic = ["version"]

dependencies = [
    "click==8.1.7"
]

[project.scripts]
python_logging_demonstrator = "daq_logging.apps.__main_logging_demonstrator__:main"

[tool.hatch.version]
path = "version.py"

[tool.hatch.packages.find]
where = ["daq_logging"]
